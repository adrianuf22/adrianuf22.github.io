<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adrianuf22 :: software engineer</title>

  <!-- SEO & Meta Tags -->
  <meta name="description"
    content="Blog and interactive avatar showcase of Adriano Caetano (adrianuf22), a software engineer.">
  <meta name="author" content="Adriano Caetano">
  <meta name="theme-color" content="#0b1320">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="adrianuf22 :: software engineer">
  <meta property="og:description"
    content="Blog and interactive avatar showcase of Adriano Caetano (adrianuf22), a software engineer.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/favicon.png">

  <!-- Favicon & PWA -->
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/src/styles/main.css">
</head>

<body>

  <!-- Ambient Light Background Effect -->
  <div class="ambient-light" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header & Navigation -->
    <header>
      <div class="topbar">
        <div class="left-content">
          <a href="#" class="heading-title" aria-label="adrianuf22.github.io Home">
            <h1>adrianu<span class="heading-blue">f22</span></h1>
            <span class="title-tag">Software Engineer</span>
          </a>
        </div>

        <div class="right-content">
          <!-- Mobile Menu Button -->
          <button id="mobile-toggle" class="mobile-toggle" aria-label="Toggle navigation menu">
            <img src="/images/icons/hamburg.svg" alt="Menu Icon" />
          </button>

          <!-- Social Links Navigation -->
          <nav class="social-menu" aria-label="Social profiles">
            <ul>
              <li>
                <a href="https://twitter.com/infernandes" title="Twitter @infernandes" target="_blank"
                  rel="noopener noreferrer">
                  <span class="icon">
                    <img src="/images/icons/twitter.svg" alt="" />
                  </span>
                  <span>Twitter</span>
                </a>
              </li>
              <li>
                <a href="https://github.com/adrianuf22" title="GitHub @adrianuf22" target="_blank"
                  rel="noopener noreferrer">
                  <span class="icon">
                    <img src="/images/icons/github.svg" alt="" />
                  </span>
                  <span>GitHub</span>
                </a>
              </li>
              <li>
                <a href="https://www.linkedin.com/in/adriano-caetano-fs/" title="LinkedIn Profile" target="_blank"
                  rel="noopener noreferrer">
                  <span class="icon">
                    <img src="/images/icons/linkedin.svg" alt="" />
                  </span>
                  <span>LinkedIn</span>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main>
      <div class="stage-wrapper">
        <!-- Interactive Avatar Body Switcher -->
        <div class="slide-body-container" id="slide-stage" title="Click or swipe to switch body">
          <div id="slide-body" class="slide-body body-cat">
            <div id="slide-body-head" class="slide-body-head">
              <img src="/images/logo.svg" alt="Adriano Caetano Avatar Head Silhouette">
            </div>
          </div>
        </div>

        <!-- Character Selection Badges -->
        <div class="character-controls">
          <div id="character-badges" class="character-badges">
            <!-- Dynamically populated badges -->
          </div>
        </div>
      </div>

      <!-- Posts Trigger Heading at bottom of first page -->
      <div class="posts-header" id="posts-heading" role="button" tabindex="0" title="Click to view posts">
        <h2>Posts</h2>
        <span class="scroll-indicator-icon">↓</span>
      </div>
    </main>

    <!-- Posts Section -->
    <section id="posts-section" class="posts-section">
      <div id="posts-grid" class="posts-grid">
        <!-- Dynamically populated posts -->
      </div>
    </section>

    <!-- Post Article Reader Modal -->
    <div id="post-modal" class="post-modal" aria-hidden="true">
      <div class="post-modal-backdrop" id="post-modal-backdrop"></div>
      <div class="post-modal-content">
        <button id="post-modal-close" class="post-modal-close" aria-label="Close article">✕</button>
        <article id="post-article" class="post-article">
          <!-- Post content injected here -->
        </article>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="copyright">
        &copy; <span id="year-copy">2026</span> Adriano Caetano. All rights reserved.
      </div>
      <div class="dev-credits">
        <span>Hosted on <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></span>
      </div>
    </footer>
  </div>

  <!-- Main JavaScript Module -->
  <script type="module" src="/src/js/main.js"></script>

  <script>
    document.getElementById('year-copy').textContent = new Date().getFullYear();
  </script>
</body>

</html>
